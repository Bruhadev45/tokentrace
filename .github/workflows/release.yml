name: Release

# Fires only on version tags. Tag on main once CI is green:
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs full history to build the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: test
        run: go test ./... -count=1
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
